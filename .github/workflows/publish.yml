name: publish

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: |
          docker buildx imagetools create \
            --tag ghcr.io/secure-rads/nsjail-docker:latest \
            ghcr.io/prdai/nsjail-docker@sha256:6c500a51d3ccadf2fb8fb312c2738aa1a6ba867a3982c0d206478c6a7edec35b
      - run: docker buildx imagetools inspect ghcr.io/secure-rads/nsjail-docker:latest --format '{{json .Manifest}}'
