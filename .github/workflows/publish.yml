name: publish

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy the pinned manifest list
        run: |
          docker run --rm quay.io/skopeo/stable copy --all \
            --src-no-creds \
            --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            docker://ghcr.io/prdai/nsjail-docker@sha256:6c500a51d3ccadf2fb8fb312c2738aa1a6ba867a3982c0d206478c6a7edec35b \
            docker://ghcr.io/secure-rads/nsjail-docker:latest
